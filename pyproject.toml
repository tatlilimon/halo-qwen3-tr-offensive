[project]
name = "halo-qwen3-tr-offensive"
version = "0.1.0"
description = "LoRA fine-tune of Qwen3-0.6B for Turkish offensive-language detection, trained with Halo on Modal"
requires-python = ">=3.12,<3.13"
# Versions match the Halo 1.3.0rc1 training image, so local CPU runs and the
# GPU runs inside that image use the same library code.
dependencies = [
    "datasets==4.8.5",
    "huggingface-hub==1.33.0",
    "modal==1.6.4",
    "numpy==2.4.6",
    "peft==0.18.1",
    "scikit-learn==1.9.0",
    "tokenizers==0.23.1",
    "torch==2.11.0",
    "transformers==5.20.2",
]

[dependency-groups]
dev = ["pytest==9.0.3", "pyyaml==6.0.3"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
